name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (musl = static, runs anywhere)
          - target: x86_64-unknown-linux-musl
            os: linux
            arch: x86_64
            suffix: ""
          - target: aarch64-unknown-linux-musl
            os: linux
            arch: aarch64
            suffix: ""
          - target: armv7-unknown-linux-musleabihf
            os: linux
            arch: arm
            suffix: ""
          - target: i686-unknown-linux-musl
            os: linux
            arch: x86
            suffix: ""
          - target: riscv64gc-unknown-linux-musl
            os: linux
            arch: riscv64
            suffix: ""
          - target: loongarch64-unknown-linux-musl
            os: linux
            arch: loongarch64
            suffix: ""
          # Android
          - target: aarch64-linux-android
            os: android
            arch: aarch64
            suffix: ""
          - target: armv7-linux-androideabi
            os: android
            arch: arm
            suffix: ""
          - target: x86_64-linux-android
            os: android
            arch: x86_64
            suffix: ""
          - target: i686-linux-android
            os: android
            arch: x86
            suffix: ""
          # Windows
          - target: x86_64-pc-windows-gnu
            os: windows
            arch: x86_64
            suffix: .exe
          - target: i686-pc-windows-gnu
            os: windows
            arch: x86
            suffix: .exe
          - target: aarch64-pc-windows-gnullvm
            os: windows
            arch: aarch64
            suffix: .exe
          # macOS
          - target: x86_64-apple-darwin
            os: macos
            arch: x86_64
            suffix: ""
          - target: aarch64-apple-darwin
            os: macos
            arch: aarch64
            suffix: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools gcc-arm-linux-gnueabihf gcc-i686-linux-gnu

      - name: Install mingw (Windows GNU targets)
        if: contains(matrix.target, 'windows-gnu')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 gcc-mingw-w64-i686

      - name: Configure linker
        run: |
          T="${{ matrix.target }}"
          mkdir -p .cargo
          case "$T" in
            *musl*) ;;
          esac
          {
            echo "[target.$T]"
            case "$T" in
              x86_64-unknown-linux-musl)   echo 'linker = "musl-gcc"' ;;
              aarch64-unknown-linux-musl)  echo 'linker = "aarch64-linux-gnu-gcc"' ;;
              armv7-unknown-linux-musleabihf) echo 'linker = "arm-linux-gnueabihf-gcc"' ;;
              i686-unknown-linux-musl)     echo 'linker = "i686-linux-gnu-gcc"' ;;
              x86_64-pc-windows-gnu)       echo 'linker = "x86_64-w64-mingw32-gcc"' ;;
              i686-pc-windows-gnu)         echo 'linker = "i686-w64-mingw32-gcc"' ;;
            esac
          } >> .cargo/config.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          NAME="abook-${{ matrix.target }}"
          mkdir -p out
          cp "target/${{ matrix.target }}/release/abook${{ matrix.suffix }}" "out/$NAME${{ matrix.suffix }}"
          chmod +x "out/$NAME${{ matrix.suffix }}" || true
          cd out
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -q "$NAME.zip" "$NAME${{ matrix.suffix }}"
          else
            tar czf "$NAME.tar.gz" "$NAME${{ matrix.suffix }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: abook-${{ matrix.target }}
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Flatten binaries for direct download
        run: |
          cd dist
          for f in *.tar.gz; do [ -e "$f" ] && tar xzf "$f"; done
          for f in *.zip;   do [ -e "$f" ] && unzip -oq "$f"; done
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true

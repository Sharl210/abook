name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Linux
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
          - target: armv7-unknown-linux-musleabihf
          - target: i686-unknown-linux-musl
          - target: riscv64gc-unknown-linux-musl
          - target: loongarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross toolchains
        run: |
          sudo apt-get update -qq
          # musl targets need a C toolchain for the target to supply crt objects.
          # riscv64 and loongarch64 are not covered by musl-gcc, so they use a
          # real cross gcc; rust-lld cannot link them on its own because the
          # self-contained runtime for those two lacks libgcc_s.
          sudo apt-get install -y -qq musl-tools gcc-arm-linux-gnueabihf gcc-i686-linux-gnu \
            gcc-aarch64-linux-gnu || true
          sudo apt-get install -y -qq gcc-riscv64-linux-gnu || true
          # loongarch64 cross gcc exists only on newer Ubuntu; try both names.
          sudo apt-get install -y -qq gcc-loongarch64-linux-gnu || \
            sudo apt-get install -y -qq gcc-14-loongarch64-linux-gnu || true
      - name: Configure
        run: |
          T="${{ matrix.target }}"
          mkdir -p .cargo
          {
            echo "[target.$T]"
            case "$T" in
              x86_64-unknown-linux-musl)       echo 'linker = "musl-gcc"' ;;
              aarch64-unknown-linux-musl)      echo 'linker = "aarch64-linux-gnu-gcc"' ;;
              armv7-unknown-linux-musleabihf)  echo 'linker = "arm-linux-gnueabihf-gcc"' ;;
              i686-unknown-linux-musl)         echo 'linker = "i686-linux-gnu-gcc"' ;;
              riscv64gc-unknown-linux-musl)
                  echo 'linker = "riscv64-linux-gnu-gcc"'
                  echo 'rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=no"]' ;;
              loongarch64-unknown-linux-musl)
                  if command -v loongarch64-linux-gnu-gcc >/dev/null; then
                      echo 'linker = "loongarch64-linux-gnu-gcc"'
                  else
                      echo 'linker = "loongarch64-unknown-linux-gnu-gcc"'
                  fi
                  echo 'rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=no"]' ;;
            esac
          } > .cargo/config.toml
          cat .cargo/config.toml
      - name: Verify linker present
        run: |
          T="${{ matrix.target }}"
          case "$T" in
            riscv64gc-unknown-linux-musl)
              command -v riscv64-linux-gnu-gcc || { echo "::error::riscv64 cross gcc missing"; exit 1; } ;;
            loongarch64-unknown-linux-musl)
              command -v loongarch64-linux-gnu-gcc || command -v loongarch64-unknown-linux-gnu-gcc \
                || echo "::warning::loongarch64 cross gcc unavailable on this runner" ;;
          esac
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        continue-on-error: false
      - name: Package
        run: |
          NAME="abook-${{ matrix.target }}"
          BIN="target/${{ matrix.target }}/release/abook"
          if [ ! -f "$BIN" ]; then
            echo "::warning::未产出二进制，跳过打包 ($NAME)"
            exit 0
          fi
          mkdir -p out
          cp "$BIN" "out/$NAME"
          chmod +x "out/$NAME"
          tar czf "out/$NAME.tar.gz" -C out "$NAME"
          echo "打包完成: $NAME ($(stat -c%s "$BIN") 字节)"
      - uses: actions/upload-artifact@v4
        with:
          name: abook-${{ matrix.target }}
          path: out/*

  # ---------------------------------------------------------------- Android
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            ndk_abi: arm64-v8a
            prefix: aarch64-linux-android
          - target: armv7-linux-androideabi
            ndk_abi: armeabi-v7a
            prefix: armv7a-linux-androideabi
          - target: x86_64-linux-android
            ndk_abi: x86_64
            prefix: x86_64-linux-android
          - target: i686-linux-android
            ndk_abi: x86
            prefix: i686-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install NDK
        run: |
          NDK_VERSION="27c"
          echo "Installing NDK r${NDK_VERSION}"
          curl -sSL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-r${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip -d "$HOME"
          echo "NDK=$HOME/android-ndk-r${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          T="${{ matrix.target }}"
          API=21
          case "$T" in
            armv7-linux-androideabi) API=21 ;;
            *) API=21 ;;
          esac
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$BIN/${{ matrix.prefix }}${API}-clang"
          echo "using $CC"
          ls -la "$CC"
          mkdir -p .cargo
          {
            echo "[target.$T]"
            echo "linker = \"$CC\""
          } > .cargo/config.toml
          echo "CC_${T//-/_}=${CC}" >> "$GITHUB_ENV"
      - name: Build
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: ${{ env.NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: ${{ env.NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang
          CARGO_TARGET_I686_LINUX_ANDROID_LINKER: ${{ env.NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android21-clang
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          NAME="abook-${{ matrix.target }}"
          BIN="target/${{ matrix.target }}/release/abook"
          if [ ! -f "$BIN" ]; then
            echo "::warning::未产出二进制，跳过打包 ($NAME)"
            exit 0
          fi
          mkdir -p out
          cp "$BIN" "out/$NAME"
          chmod +x "out/$NAME"
          tar czf "out/$NAME.tar.gz" -C out "$NAME"
          echo "打包完成: $NAME ($(stat -c%s "$BIN") 字节)"
      - uses: actions/upload-artifact@v4
        with:
          name: abook-${{ matrix.target }}
          path: out/*

  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
          - target: i686-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install mingw
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 gcc-mingw-w64-i686
      - name: Configure
        run: |
          T="${{ matrix.target }}"
          mkdir -p .cargo
          {
            echo "[target.$T]"
            case "$T" in
              x86_64-pc-windows-gnu) echo 'linker = "x86_64-w64-mingw32-gcc"' ;;
              i686-pc-windows-gnu)   echo 'linker = "i686-w64-mingw32-gcc"' ;;
            esac
          } > .cargo/config.toml
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          NAME="abook-${{ matrix.target }}"
          mkdir -p out
          cp "target/${{ matrix.target }}/release/abook.exe" "out/$NAME.exe"
          cd out && zip -q "$NAME.zip" "$NAME.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: abook-${{ matrix.target }}
          path: out/*

  # ---------------------------------------------------------------- macOS
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          NAME="abook-${{ matrix.target }}"
          BIN="target/${{ matrix.target }}/release/abook"
          if [ ! -f "$BIN" ]; then
            echo "::warning::未产出二进制，跳过打包 ($NAME)"
            exit 0
          fi
          mkdir -p out
          cp "$BIN" "out/$NAME"
          chmod +x "out/$NAME"
          tar czf "out/$NAME.tar.gz" -C out "$NAME"
          echo "打包完成: $NAME ($(stat -c%s "$BIN") 字节)"
      - uses: actions/upload-artifact@v4
        with:
          name: abook-${{ matrix.target }}
          path: out/*

  # ---------------------------------------------------------------- Release
  release:
    needs: [linux, android, windows, macos]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Flatten
        run: |
          cd dist
          for f in *.tar.gz; do [ -e "$f" ] && tar xzf "$f"; done
          for f in *.zip;    do [ -e "$f" ] && unzip -oq "$f"; done
          rm -f *.tar.gz *.zip
          ls -la
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest build' }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
